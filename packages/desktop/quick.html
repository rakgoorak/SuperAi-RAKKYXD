<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: transparent; font: 14px/1.5 "Segoe UI", -apple-system, BlinkMacSystemFont, "Noto Sans Thai", sans-serif; }
  form { box-sizing: border-box; height: 100%; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px 10px; border: 1px solid #3a3a35; border-radius: 14px; background: #262624; color: #eeede7; }
  textarea { flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: inherit; font: inherit; font-size: 15px; }
  textarea::placeholder { color: #8f8e87; }
  small { color: #8f8e87; font-size: 11.5px; }
</style>
</head>
<body>
<form id="form">
  <textarea id="text" rows="2" autofocus></textarea>
  <small id="hint"></small>
</form>
<script src="quick.js"></script>
</body>
</html>
