<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'" />
  <title data-t="title">Install SuperAi &amp; RAKKYXD</title>
  <link rel="stylesheet" href="installer.css" />
</head>
<body data-state="welcome">
  <header class="titlebar">
    <span class="titlebar-name" data-t="title">Install SuperAi &amp; RAKKYXD</span>
    <select class="language" id="language" data-t-label="language" aria-label="Language">
      <option value="en">English</option><option value="th">ภาษาไทย</option><option value="ja">日本語</option><option value="zh">简体中文</option>
    </select>
    <div class="window-buttons">
      <button type="button" data-window="minimize" data-t-label="minimize" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8" /></svg></button>
      <button type="button" data-window="close" data-t-label="close" aria-label="Close the installer"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" /></svg></button>
    </div>
  </header>

  <section class="stage" aria-hidden="true">
    <div class="streak streak-green"></div>
    <div class="streak streak-blue"></div>
    <div class="aurora"></div>
    <div class="emblem">
      <svg class="orbit" viewBox="0 0 400 260">
        <defs>
          <linearGradient id="orbit-gradient" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#30f457" />
            <stop offset="0.55" stop-color="#00c2a6" />
            <stop offset="1" stop-color="#1a8cff" />
          </linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>
        <ellipse class="orbit-track" cx="200" cy="130" rx="182" ry="96" />
        <ellipse class="orbit-progress" cx="200" cy="130" rx="182" ry="96" pathLength="1000" filter="url(#glow)" />
        <g class="orbit-star"><path d="M0 -11 L2.6 -2.6 L11 0 L2.6 2.6 L0 11 L-2.6 2.6 L-11 0 L-2.6 -2.6 Z" /></g>
      </svg>
      <img class="mark" src="../../studio/client/dist/brand/mark.png" alt="" draggable="false" />
    </div>
    <p class="tagline">SMARTER <i></i> FASTER <i></i> TOGETHER</p>
  </section>

  <main class="panel">
    <!-- Welcome -->
    <div class="view view-welcome">
      <img class="wordmark" src="../../studio/client/dist/brand/wordmark.png" alt="SuperAi & RAKKYXD" draggable="false" />
      <h1 id="welcome-title" data-t-html="welcome"></h1>
      <p class="lead" data-t="lead"></p>

      <div class="field">
        <span class="field-label" data-t="installTo"></span>
        <div class="location">
          <span class="location-path" id="location" title=""></span>
          <button type="button" class="ghost" id="change" data-t="change"></button>
        </div>
      </div>

      <label class="toggle">
        <input type="checkbox" id="desktop" checked />
        <span class="switch" aria-hidden="true"></span>
        <span data-t="desktop"></span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="launch" checked />
        <span class="switch" aria-hidden="true"></span>
        <span data-t="launch"></span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="usage" checked />
        <span class="switch" aria-hidden="true"></span>
        <span data-t="usage"></span>
      </label>
      <p class="meta privacy-note"><span data-t="privacyNote"></span>
        <button type="button" class="link" id="privacy" data-t="privacy"></button></p>

      <div class="actions">
        <button type="button" class="primary" id="install"><span id="install-label" data-t="install"></span>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" /></svg></button>
        <p class="meta" id="meta"></p>
      </div>
    </div>

    <!-- Installing -->
    <div class="view view-installing" aria-live="polite">
      <h1 data-t="installing"></h1>
      <p class="percent"><span id="percent">0</span><small>%</small></p>
      <ol class="steps">
        <li data-step="copy"><span class="dot"></span><span data-t="copy"></span></li>
        <li data-step="shortcuts"><span class="dot"></span><span data-t="shortcuts"></span></li>
        <li data-step="register"><span class="dot"></span><span data-t="register"></span></li>
      </ol>
      <p class="meta" id="target"></p>
    </div>

    <!-- Done -->
    <div class="view view-done">
      <h1 data-t="done"></h1>
      <p class="lead"><span id="done-lead"></span><span id="done-desktop" data-t="doneDesktop"></span></p>
      <div class="actions">
        <button type="button" class="primary" id="open"><span data-t="open"></span>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" /></svg></button>
        <button type="button" class="ghost" id="finish" data-t="finish"></button>
      </div>
      <p class="meta" data-t="nextUpdate"></p>
    </div>

    <!-- Error -->
    <div class="view view-error" role="alert">
      <h1 data-t="failed"></h1>
      <p class="lead error-text" id="error"></p>
      <div class="actions">
        <button type="button" class="primary" id="retry" data-t="retry"></button>
      </div>
    </div>
  </main>
  <script src="installer-text.js"></script>
  <script src="installer.js"></script>
</body>
</html>
