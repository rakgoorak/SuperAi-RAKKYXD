name: Deploy website

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cut a Pages deployment off halfway; a newer push waits its turn.
  cancel-in-progress: false

jobs:
  # Upload and deploy run as separate jobs (GitHub's recommended layout):
  # the artifact is fully registered before deploy-pages looks it up, and
  # "Re-run failed jobs" retries only the deploy against the one artifact
  # instead of uploading a second "github-pages" artifact into the same run.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
