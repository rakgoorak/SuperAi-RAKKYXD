name: CI / Automated Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Monorepo Workspaces
        run: npm run build

      - name: Every interface text has its translations
        run: npm run i18n:check

      - name: Run Test Suite (Core, Studio, Desktop)
        run: npm test
        timeout-minutes: 8

      - name: Run Tray Smoke (macOS menu-bar icon)
        if: runner.os == 'macOS'
        run: npm run test:tray
        timeout-minutes: 5

      - name: Run Desktop Smoke Harness (Windows)
        if: runner.os == 'Windows'
        run: npm run test:desktop
        timeout-minutes: 5

      - name: Run Browser Use, Computer Use and Chat Queue Smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run test:browser-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:computer-use
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:queue
          exit $LASTEXITCODE
        timeout-minutes: 8
